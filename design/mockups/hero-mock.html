<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hero Mockup — Editorial Split</title>
  <style>
    :root{
      --bg:#0f0f0f; --fg:#f5f2ec; --muted:#b9b5af; --primary:#d8c3a5;
      --content-width:720px; --rail-width:320px; --gap:24px; --baseline:8px;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Inter, system-ui, -apple-system, "Instrument Sans", sans-serif}
    .wrap{max-width:1400px;margin:0 auto;padding:48px 28px}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gap);align-items:start}
    .left{grid-column:1 / span 8}
    .rail{grid-column:9 / span 4;position:relative}
    .badge{display:inline-block;padding:6px 10px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);color:var(--muted);font-family:'JetBrains Mono', monospace;font-size:12px;border-radius:4px}
    h1{font-size:56px;line-height:1.06;margin:18px 0 12px 0;letter-spacing:-0.02em}
    p.lead{color:var(--muted);max-width:60ch;font-size:18px;line-height:1.6}
    .ctas{margin-top:20px;display:flex;gap:12px}
    .btn{background:var(--primary);border-radius:8px;padding:10px 16px;color:#111;border:none;font-weight:600}
    .btn-outline{background:transparent;border:1px solid rgba(255,255,255,0.08);padding:10px 14px;border-radius:8px;color:var(--fg)}
    /* rail styles */
    .rail .numeral{position:absolute;right:0;top:-8px;font-size:220px;line-height:0.9;color:rgba(216,195,165,0.06);font-weight:800;pointer-events:none}
    .rail .meta{position:relative;display:flex;flex-direction:column;gap:12px;align-items:flex-end}
    .meta .stack{background:transparent;border-radius:6px;padding:8px 10px;color:var(--muted);text-align:right}
    .social-vertical{display:flex;flex-direction:column;gap:8px;margin-top:18px}
    .social-vertical a{display:inline-block;width:44px;height:44px;border-radius:8px;background:rgba(255,255,255,0.02);display:flex;align-items:center;justify-content:center;color:var(--muted);text-decoration:none}
    /* responsive */
    @media (max-width:900px){
      .grid{grid-template-columns:1fr;}
      .left{grid-column:1 / -1}
      .rail{grid-column:1 / -1;order:3;margin-top:20px}
      .rail .numeral{font-size:120px;right:auto;left:0;opacity:0.06}
      h1{font-size:36px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="grid">
      <div class="left">
        <div class="badge">Available for work</div>
        <div style="height:6px"></div>
        <div class="label-mono" style="color:var(--muted);font-family:'JetBrains Mono', monospace;font-size:13px;">Anupam Baral</div>
        <h1>Full stack<br/>developer.</h1>
        <p class="lead">Building production-ready web applications and intelligent systems. From scalable SaaS platforms to machine learning pipelines — I engineer things that work.</p>
        <div class="ctas">
          <button class="btn">View work</button>
          <button class="btn-outline">Get in touch</button>
        </div>
      </div>

      <aside class="rail" aria-hidden="true">
        <div class="numeral">01</div>
        <div class="meta">
          <div class="stack">Butwal, Nepal · Available</div>
          <div class="stack">BCA — Butwal Kalika Campus</div>
          <div class="social-vertical" style="align-items:flex-end">
            <a href="#">GH</a>
            <a href="#">LI</a>
          </div>
        </div>
      </aside>
    </div>
  </div>
</body>
</html>
